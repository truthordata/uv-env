[project]
name = "uv-env"
version = "0.2.0"
description = "Select dotenv profiles for uv projects"
readme = "README.md"
authors = [
    { name = "Tim Sawicki", email = "truthordata@gmail.com" }
]
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
uv-env = "uv_env.cli:app"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
